name: Build Daily Routine Tracker APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Check out project
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install JavaScript dependencies
        run: npm install
      - name: Prepare Capacitor web assets
        run: |
          mkdir -p www
          cp index.html sw.js manifest.webmanifest icon-192.png icon-512.png www/
      - name: Add Android platform
        run: npx cap add android
      - name: Configure launcher icons and alarm support
        run: |
          R=android/app/src/main/res
          rm -rf "$R/mipmap-anydpi-v26"
          for p in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            d=${p%%:*}; s=${p##*:}; mkdir -p "$R/mipmap-$d"
            cp "ic_$s.png" "$R/mipmap-$d/ic_launcher.png"
            cp "ic_$s.png" "$R/mipmap-$d/ic_launcher_round.png"
          done
          J=android/app/src/main/java/com/mydaily/tracker
          mkdir -p "$J"
          cp AlarmPlugin.java AlarmReceiver.java AlarmActivity.java MainActivity.java "$J/"
          python3 patch_manifest.py
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Verify alarm permissions
        run: |
          grep -q USE_EXACT_ALARM android/app/src/main/AndroidManifest.xml
          grep -q SCHEDULE_EXACT_ALARM android/app/src/main/AndroidManifest.xml
      - name: Build installable debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Daily-Routine-Tracker-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
